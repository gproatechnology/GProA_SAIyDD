<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SaIyDD | Sistema de Aprendizaje Inclusivo</title>
    <meta
      name="description"
      content="SaIyDD: IA educativa infantil segura y estimulante para preescolar y escolar temprana."
    />
    <meta name="theme-color" content="#FFD166" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./assets/images/logo-saiydd.webp" />

    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <a href="#app" class="skip-link">Saltar al contenido principal</a>
    <div
      id="splash"
      class="splash"
      role="region"
      aria-label="Pantalla de carga inicial"
    >
      <div class="splash-card">
        <div class="splash-logo">SaIyDD</div>
        <div class="splash-title">Sistema de Aprendizaje Inclusivo</div>
        <div class="splash-loader" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div
          class="splash-status"
          id="splashStatus"
          role="status"
          aria-live="polite"
        >
          Cargando...
        </div>
      </div>
    </div>
    <main id="app" class="app-container" role="main"></main>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
